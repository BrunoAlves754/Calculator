<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Calculator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section id="calculator">
      <header>
        <p>Calculator</p>

        <div id="theme-container">
          <p>THEME</p>

          <select name="theme" id="theme">
            <option value="dark">Dark</option>
            <option value="white">White</option>
            <option value="neon">Neon</option>
          </select>
        </div>
      </header>

      <div id="display">
        <p id="lastNumber"></p>|
        <p id="currentNumber"></p>
      </div>

      <div id="container-buttons">
        <button value="7" class="btn">7</button>
        <button value="8" class="btn">8</button>
        <button value="9" class="btn">9</button>
        <button id="del">DEL</button>
        <button value="4" class="btn">4</button>
        <button value="5" class="btn">5</button>
        <button value="6" class="btn">6</button>
        <button value="+" class="operator">+</button>
        <button value="1" class="btn">1</button>
        <button value="2" class="btn">2</button>
        <button value="3" class="btn">3</button>
        <button value="-" class="operator">-</button>
        <button value="," class="operator">.</button>
        <button value="0" class="btn">0</button>
        <button value="/" class="operator">/</button>
        <button value="*" class="operator">x</button>
        <button id="reset">RESET</button>
        <button id="res">=</button>
      </div>

    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Bruno Alves</a>.
  </footer>

  <script src="script.js"></script>

</body>

</html>
